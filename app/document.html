<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mdslides document</title>
<link rel="stylesheet" href="/vendor/highlight-monokai.css">
<link rel="stylesheet" href="/vendor/katex.min.css">
<link rel="stylesheet" href="/outline.css">
<style>
  /* GitHub-flavored markdown look (dark theme, real heading hierarchy,
     styled code/blockquotes/tables) -- its own design, distinct from the
     reveal-black theme slide mode uses (this is a continuous document, so
     it should read like one), using GitHub's own dark-mode palette. */
  html, body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  #mdslides-document {
    max-width: 860px; margin: 0 auto; padding: 3rem 2rem 8rem;
    box-sizing: border-box;
  }
  #mdslides-document img { max-width: 100%; box-sizing: border-box; }
  #mdslides-document h1, #mdslides-document h2, #mdslides-document h3,
  #mdslides-document h4, #mdslides-document h5, #mdslides-document h6 {
    font-weight: 600; line-height: 1.25;
    margin-top: 1.5em; margin-bottom: 16px;
  }
  #mdslides-document h1 {
    font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid #30363d;
  }
  #mdslides-document h2 {
    font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid #30363d;
  }
  #mdslides-document h3 { font-size: 1.25em; }
  #mdslides-document h4 { font-size: 1em; }
  #mdslides-document h5 { font-size: 0.875em; }
  #mdslides-document h6 { font-size: 0.85em; color: #8b949e; }
  #mdslides-document > :first-child { margin-top: 0; }
  #mdslides-document p, #mdslides-document ul, #mdslides-document ol {
    margin-top: 0; margin-bottom: 16px;
  }
  #mdslides-document li + li { margin-top: 0.25em; }
  #mdslides-document a { color: #58a6ff; text-decoration: none; }
  #mdslides-document a:hover { text-decoration: underline; }
  #mdslides-document code {
    background: rgba(110, 118, 129, 0.4); padding: 0.2em 0.4em;
    border-radius: 6px; font-size: 85%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #mdslides-document pre {
    background: #161b22; padding: 16px; border-radius: 6px;
    overflow-x: auto; font-size: 85%; line-height: 1.45;
  }
  #mdslides-document pre code {
    background: none; padding: 0; border-radius: 0; font-size: 100%;
  }
  #mdslides-document blockquote {
    margin: 0 0 16px; padding: 0 1em; color: #8b949e;
    border-left: 0.25em solid #3b434b;
  }
  #mdslides-document blockquote > :last-child { margin-bottom: 0; }
  #mdslides-document table {
    border-collapse: collapse; width: 100%; margin-bottom: 16px;
    display: block; overflow-x: auto;
  }
  #mdslides-document th, #mdslides-document td {
    border: 1px solid #30363d; padding: 6px 13px;
  }
  #mdslides-document tr:nth-child(2n) { background: #161b22; }
  #mdslides-document hr {
    height: 0.25em; padding: 0; margin: 24px 0;
    background: #30363d; border: 0;
  }
  #mdslides-document .katex-display { margin: 0.5em 0; overflow-x: auto; }
  #mdslides-document .mermaid { background: transparent; text-align: center; }
  #mdslides-status {
    position: fixed; bottom: 6px; right: 10px; z-index: 1000;
    font: 11px monospace; color: #888; opacity: 0.6; pointer-events: none;
  }
</style>
</head>
<body>
<div id="mdslides-document">
__SLIDES__
</div>
<div id="mdslides-status">mdslides: connecting&hellip;</div>

<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<script>
  window.mdslidesInitialIndex = __INITIAL_INDEX__;
  window.mdslidesOutlineData = __OUTLINE__;

  // 'dark' matches this mode's dark, GitHub-style document look.
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });

  // Continuous-document equivalent of Reveal's deck/slide model: "position"
  // is which heading anchor (id="mdslides-heading-N", written by
  // renderDocumentHtml() in render.js) is currently nearest the top of the
  // viewport, tracked via a plain scroll listener rather than an
  // IntersectionObserver -- simpler to reason about correctness for, and
  // there's no meaningful performance difference at this scale.
  let currentIndex = 0;
  let positionChangedCallback = null;
  let scrollScheduled = false;

  function computeCurrentIndex() {
    const anchors = document.querySelectorAll('[id^="mdslides-heading-"]');
    let idx = 0;
    for (const el of anchors) {
      if (el.getBoundingClientRect().top <= 100) {
        idx = Number(el.id.slice('mdslides-heading-'.length));
      } else {
        break;
      }
    }
    return idx;
  }

  function onScroll() {
    if (scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(() => {
      scrollScheduled = false;
      const next = computeCurrentIndex();
      if (next !== currentIndex) {
        currentIndex = next;
        if (positionChangedCallback) positionChangedCallback();
      }
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  // Adapter consumed by the shared outline/fold UI in outline.js -- see
  // that file for the contract.
  window.mdslidesDeck = {
    gotoIndex(index) {
      const el = document.getElementById('mdslides-heading-' + index);
      if (el) el.scrollIntoView({ block: 'start' });
      currentIndex = index;
    },
    getCurrentIndex: () => currentIndex,
    onPositionChanged(fn) { positionChangedCallback = fn; },
    getTotalCount: () => document.querySelectorAll('[id^="mdslides-heading-"]').length,
  };
</script>
<script src="/outline.js"></script>
<script>
  window.mdslidesDeck.gotoIndex(window.mdslidesInitialIndex || 0);
  window.mdslidesOutline.init();

  const statusEl = document.getElementById('mdslides-status');
  const documentEl = document.getElementById('mdslides-document');

  const source = new EventSource('/events');
  source.onopen = () => { statusEl.textContent = 'mdslides: live'; };
  source.onerror = () => { statusEl.textContent = 'mdslides: disconnected'; };
  // Cursor-follow mode (opt-in on the Vim side via g:mdslides_follow_cursor):
  // scroll to whatever section the server says the cursor is currently
  // under. A no-op unless the Vim side is actually sending /cursor requests.
  source.addEventListener('goto', (ev) => {
    const { index } = JSON.parse(ev.data);
    if (Number.isInteger(index) && index >= 0 && index < window.mdslidesDeck.getTotalCount()) {
      window.mdslidesDeck.gotoIndex(index);
    }
  });

  source.addEventListener('update', (ev) => {
    const { html, outline: newOutline } = JSON.parse(ev.data);
    // Replacing the whole document on every edit would otherwise yank
    // scroll position back to the top -- restore it to the same heading
    // afterwards (same per-heading granularity limitation slide mode
    // already has via deck.slide(), not a regression).
    const positionToRestore = currentIndex;
    documentEl.innerHTML = html;
    mermaid.run({ querySelector: '.mermaid' });
    window.mdslidesDeck.gotoIndex(positionToRestore);
    window.mdslidesOutline.refresh(newOutline);
    statusEl.textContent = 'mdslides: live (updated)';
    setTimeout(() => { statusEl.textContent = 'mdslides: live'; }, 1000);
  });

  mermaid.run({ querySelector: '.mermaid' });
</script>
</body>
</html>
