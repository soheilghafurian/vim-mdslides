<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mdslides</title>
<link rel="stylesheet" href="/vendor/reveal.css">
<link rel="stylesheet" href="/vendor/reveal-black.css">
<link rel="stylesheet" href="/vendor/highlight-monokai.css">
<link rel="stylesheet" href="/vendor/katex.min.css">
<style>
  .reveal .katex-display { margin: 0.5em 0; }
  .reveal .mermaid { background: transparent; }
  /* reveal.css defaults .reveal .slides to text-align:center, centering
     every heading, paragraph, and list item. Override it so slide text
     reads left-aligned, like a normal document. */
  .reveal .slides {
    text-align: left;
  }
  /* Each slide's real content lives in .slide-fit, an unscaled measurement
     box that gets shrunk (never grown) via a CSS transform in JS so it
     always fits within the slide -- see fitSlide() below. */
  /* display itself is NOT set here: reveal.js forces an inline
     style.display on the active section (its "display" config option,
     default "block"), which always wins over any stylesheet rule here
     regardless of specificity. We set display via that config option
     instead (below) so it actually takes effect. */
  .reveal .slides section.present {
    align-items: center;
    justify-content: center;
    overflow: hidden;
    height: 100%;
  }
  .reveal .slide-fit {
    width: 100%;
    transform-origin: center center;
  }
  #mdslides-status {
    position: fixed; bottom: 6px; right: 10px; z-index: 1000;
    font: 11px monospace; color: #888; opacity: 0.6; pointer-events: none;
  }
  /* Hierarchical outline/tree panel: an overlay drawer sliding in from the
     left, listing every heading (indented by level) so the presenter can
     jump around the deck. It sits on top of the slides rather than
     resizing them, to avoid fighting reveal's own width/height sizing. */
  #mdslides-outline {
    position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
    background: rgba(10, 10, 10, 0.95); color: #eee;
    overflow-y: auto; box-sizing: border-box; padding: 40px 12px 12px;
    z-index: 950; transform: translateX(-100%);
    transition: transform 0.2s ease;
    font: 15px/1.4 sans-serif;
  }
  #mdslides-outline.visible {
    transform: translateX(0);
  }
  #mdslides-outline a {
    display: block; color: #ccc; text-decoration: none;
    padding: 4px 8px; border-radius: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #mdslides-outline a:hover {
    background: rgba(255, 255, 255, 0.08);
  }
  #mdslides-outline a.current {
    color: #fff; font-weight: bold;
    background: rgba(255, 255, 255, 0.15);
  }
  #mdslides-outline-toggle {
    position: fixed; top: 8px; left: 10px; z-index: 960;
    background: rgba(10, 10, 10, 0.6); color: #ccc;
    border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 3px;
    font: 16px monospace; line-height: 1; padding: 5px 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="reveal">
  <div class="slides" id="mdslides-slides">
__SLIDES__
  </div>
</div>
<button id="mdslides-outline-toggle" title="Toggle outline (0)">&#9776;</button>
<nav id="mdslides-outline"></nav>
<div id="mdslides-status">mdslides: connecting&hellip;</div>

<script src="/vendor/reveal.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });

  // Set server-side from the cursor line Vim was on when :MDSlidesStart
  // ran. Reveal (hash: true, below) reads location.hash as part of its own
  // initialize() to decide which slide to land on, so seeding the hash
  // *before* constructing/initializing it is what makes the deck open on
  // that slide -- setting it via deck.slide() afterwards is a race against
  // Reveal's own initial hash read and gets clobbered.
  {
    const initialIndex = __INITIAL_INDEX__;
    if (Number.isInteger(initialIndex) && initialIndex > 0 && !location.hash) {
      location.hash = '/' + initialIndex;
    }
  }

  const deck = new Reveal({
    hash: true,
    slideNumber: true,
    navigationMode: 'linear',
    // Reveal's default 960x700 canvas is ~4:3 and gets letterboxed with
    // big empty bars on either side of any wider (e.g. 16:9) browser
    // window. Sizing the canvas to the viewport itself instead means it
    // always fills the available space.
    width: '100%',
    height: '100%',
    // We center slide content ourselves via the flex box on
    // section.present (and scale it to fit via fitSlide() below), so
    // reveal's own JS-driven vertical centering must stay off -- otherwise
    // it fights our fixed-height section, offsetting/clipping oversized
    // content before fitSlide gets a chance to shrink it.
    center: false,
    // reveal.js sets this as an inline style on the active section, which
    // beats any CSS rule -- so this is how section.present actually
    // becomes a flex container (see the CSS comment above).
    display: 'flex',
    plugins: [RevealHighlight],
  });

  // Shrinks a slide's content (text, images, diagrams -- everything) down
  // via a CSS transform if it doesn't fit, so slides never scroll or clip.
  // Content is never scaled *up* -- a slide with little content just shows
  // it at normal size. Only the currently visible slide can be measured
  // (others are display:none), so this runs on demand rather than upfront.
  function fitSlide(section) {
    if (!section) return;
    const fit = section.querySelector(':scope > .slide-fit');
    if (!fit) return;

    fit.style.transform = 'none';

    // section's height:100% just matches whatever .slides is sized to, so
    // measuring against section itself would compare content to a moving
    // target. The real fixed slide canvas (reveal's configured
    // width/height) is the .slides container, which reveal.js gives an
    // explicit pixel size.
    const slides = section.closest('.slides');
    if (!slides) return;
    const style = getComputedStyle(section);
    const availW = slides.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
    const availH = slides.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    const scale = Math.min(1, availW / fit.scrollWidth, availH / fit.scrollHeight);

    if (isFinite(scale) && scale < 1) {
      fit.style.transform = `scale(${scale})`;
    }
  }

  function fitCurrentSlide() {
    fitSlide(deck.getCurrentSlide());
  }

  // Images affect content height only once they've loaded; refit when they
  // do (harmless no-op if the slide already fit without them).
  function watchImages(section) {
    section.querySelectorAll('img').forEach((img) => {
      if (!img.complete) {
        img.addEventListener('load', fitCurrentSlide, { once: true });
      }
    });
  }

  // Hierarchical outline/tree panel listing every heading, indented by
  // level, so the presenter can jump straight to a slide. Toggled via the
  // on-screen button or the "0" key; rebuilt whenever the deck updates
  // (headings may have been added/removed/retitled) or the slide changes
  // (to keep the "current" highlight in sync).
  let outline = __OUTLINE__;
  const outlineEl = document.getElementById('mdslides-outline');
  const outlineToggleEl = document.getElementById('mdslides-outline-toggle');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function renderOutline() {
    outlineEl.innerHTML = outline
      .map((item) => {
        const indent = 8 + Math.max(0, item.level - 1) * 14;
        return `<a href="#" data-index="${item.index}" style="padding-left:${indent}px">${escapeHtml(item.text)}</a>`;
      })
      .join('');
    updateOutlineCurrent();
  }

  function updateOutlineCurrent() {
    const current = deck.getIndices().h;
    outlineEl.querySelectorAll('a').forEach((a) => {
      a.classList.toggle('current', Number(a.dataset.index) === current);
    });
  }

  outlineEl.addEventListener('click', (ev) => {
    const a = ev.target.closest('a');
    if (!a) return;
    ev.preventDefault();
    deck.slide(Number(a.dataset.index), 0);
  });

  function setOutlineVisible(visible) {
    outlineEl.classList.toggle('visible', visible);
  }

  outlineToggleEl.addEventListener('click', () => {
    setOutlineVisible(!outlineEl.classList.contains('visible'));
  });

  deck.initialize().then(() => {
    fitCurrentSlide();
    watchImages(deck.getCurrentSlide());
    mermaid.run({ querySelector: '.mermaid' }).then(fitCurrentSlide);
    renderOutline();
    deck.addKeyBinding(
      { keyCode: 48, key: '0', description: 'Toggle slide outline' },
      () => setOutlineVisible(!outlineEl.classList.contains('visible'))
    );
  });

  deck.on('slidechanged', (event) => {
    fitSlide(event.currentSlide);
    watchImages(event.currentSlide);
    updateOutlineCurrent();
  });

  window.addEventListener('resize', fitCurrentSlide);

  const statusEl = document.getElementById('mdslides-status');
  const slidesEl = document.getElementById('mdslides-slides');

  const source = new EventSource('/events');
  source.onopen = () => { statusEl.textContent = 'mdslides: live'; };
  source.onerror = () => { statusEl.textContent = 'mdslides: disconnected'; };
  // Cursor-follow mode (opt-in on the Vim side via g:mdslides_follow_cursor):
  // jump to whatever slide the server says the cursor is currently under.
  // A no-op unless the Vim side is actually sending /cursor requests.
  source.addEventListener('goto', (ev) => {
    const { index } = JSON.parse(ev.data);
    if (Number.isInteger(index) && index >= 0 && index < deck.getTotalSlides()) {
      deck.slide(index, 0);
    }
  });

  source.addEventListener('update', (ev) => {
    const { html, outline: newOutline } = JSON.parse(ev.data);
    const indices = deck.getIndices();
    slidesEl.innerHTML = html;
    deck.sync();
    const h = Math.min(indices.h, deck.getTotalSlides() - 1);
    deck.slide(Math.max(h, 0), indices.v || 0);
    mermaid.run({ querySelector: '.mermaid' }).then(fitCurrentSlide);
    fitCurrentSlide();
    watchImages(deck.getCurrentSlide());
    outline = newOutline;
    renderOutline();
    statusEl.textContent = 'mdslides: live (updated)';
    setTimeout(() => { statusEl.textContent = 'mdslides: live'; }, 1000);
  });
</script>
</body>
</html>
